name: Unit Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tests run against SGLang main, the SGLang this package is served with
      # and the one SGLang's GPU CI runs the E2E tests on, so a binding SGLang
      # changes fails here first.
      - name: Check out SGLang main
        uses: actions/checkout@v4
        with:
          repository: sgl-project/sglang
          ref: main
          path: .ci/sglang
          persist-credentials: false

      - name: Record the SGLang commit
        run: |
          sha=$(git -C .ci/sglang rev-parse HEAD)
          echo "SGLang main at $sha"
          echo "Unit tests ran against SGLang main at \`$sha\`." >> "$GITHUB_STEP_SUMMARY"

      # CPU unit tests do not use SGLang's optional Rust extensions. Install
      # SGLang's own torch pin before building so build isolation does not
      # download it twice. CUDA Python dependencies still come from SGLang's own
      # package metadata.
      - name: Install SGLang and the package
        env:
          SGLANG_BUILD_RUST_EXTS: none
        run: |
          python -m pip install uv
          torch=$(grep -oE '"torch==[^"]+"' .ci/sglang/python/pyproject.toml | head -1 | tr -d '"')
          uv pip install --system "$torch" setuptools setuptools-rust setuptools-scm wheel pytest
          uv pip install --system --no-build-isolation --prerelease allow ./.ci/sglang/python
          uv pip install --system --no-deps -e .

      - name: Run unit tests
        run: python -m pytest test/unit -v -rfE
