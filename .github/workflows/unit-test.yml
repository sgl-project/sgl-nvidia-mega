name: Unit Test

on:
  pull_request:
  push:
    branches: [main]
  # nightly against SGLang's newest nightly wheel, so a rename on SGLang main
  # fails here before it reaches a pinned bump
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # PRs and pushes test against this SGLang nightly (a sgl-project/whl release
  # tag); bump it to move the pin. The package needs SGLang main from
  # sgl-project/sglang#45389 on, which no tagged release has yet.
  SGLANG_NIGHTLY_TAG: nightly-2026-10-28-15d39bd840

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # the nightly wheels are cp312 only
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve the SGLang nightly
        id: sglang
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$SGLANG_NIGHTLY_TAG"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            tag=$(gh release list -R sgl-project/whl --limit 50 --json tagName \
              --jq '[.[].tagName | select(startswith("nightly-"))][0]')
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release download "$tag" -R sgl-project/whl \
            --pattern 'sglang-*-cp312-*x86_64.whl' --dir "$RUNNER_TEMP/whl"
          ls "$RUNNER_TEMP/whl"

      # The CUDA wheels (torch, FlashInfer, CuTe DSL, the CUDA Python bindings)
      # install and import without a GPU; the unit tests mock the device.
      - name: Install SGLang and the package
        run: |
          python -m pip install uv
          uv pip install --system --prerelease allow "$RUNNER_TEMP"/whl/sglang-*.whl pytest
          uv pip install --system --no-deps -e .

      - name: Run unit tests
        run: python -m pytest test/unit -v
